[build]
  command = "npm run build:web"
  publish = "dist"

[[redirects]]
  from = "/api/send-parent-alert"
  to = "/.netlify/functions/send-parent-alert"
  status = 200

[[redirects]]
  from = "/api/ai-attendance-insights"
  to = "/.netlify/functions/ai-attendance-insights"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
